name: si_plm

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Core runtime stack should be consistent with pytorch channel
  - python=3.9
  - pytorch=1.12.1
  - cudatoolkit=11.6
  - pip=23.0.1
  - setuptools=59.5.0

  # These are mostly pure Python / light native deps; fine to mix
  - torchmetrics
  - matplotlib
  - tensorboardx=2.5.1
  - python-lmdb=1.4.1

  - pip:
      - numpy
      - pandas
      - scipy
      - scikit-learn
      - tqdm
      - umap-learn
      - requests
      - boto3
      - filelock
      - ninja
      - biopython

# Additionally install torch-geometric with below cmd
# pip install torch-geometric -f https://data.pyg.org/whl/torch-1.12.0+cu116.html
